[package]
name = "kfs"
version = "0.1.0"
edition = "2024"

# stop panic because unwinfing panics not supported without std 
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[lib]
crate-type = ["staticlib"]

# For global Writer not define at compile time but at execution time
[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# To use Mutex
[dependencies]
spin = "0.5.2"