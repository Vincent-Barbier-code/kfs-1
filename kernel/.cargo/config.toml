[build]
# points to file in project root
target = "x86-vb_os-bare_metal.json"

[target.x86-vb_os-bare_metal]
rustflags = [
    "-C", "link-arg=-T../linker.ld",
    "-C", "link-arg=../boot/boot.o",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
# Pour charger mon json
json-target-spec = true
